<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pubmy</title>
<meta name="description" content="Ubah dokumen, e-book, dan komik jadi EPUB 3 langsung di browser, atau buka EPUB untuk dibaca.">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;--accent:#0f5c63;--accent-ink:#0f5c63;--bg:#f4f7f7;--surface:#ffffff;--text:#1b1b1f;--muted:#55555c;--border:#cfd8da;--ok:#1a6b3a;--err:#a1251b;--track:#dbe6e7;--over-bg:#e3f0f1;--disabled-bg:#c9c9d1;--pv-stage:#50535f}
/* The only dark values. Keep this the single plain :root above and this block the only override: theme tests read the first :root. */
@media (prefers-color-scheme:dark){:root{--accent:#0f5c63;--accent-ink:#5cc4ce;--bg:#121416;--surface:#1b1e21;--text:#e8eaed;--muted:#aab0b7;--border:#343a40;--ok:#7fd69b;--err:#ff9d93;--track:#2a3236;--over-bg:#1d3a3e;--disabled-bg:#3a3f45;--pv-stage:#50535f}}
*,*::before,*::after{box-sizing:border-box}
html{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;color:var(--text);background:var(--bg)}
body{margin:0;min-width:320px}
main{max-width:40rem;margin:0 auto;padding:1rem}
/* The static text is Indonesian for a desktop pointer; main.js picks the visitor's language and touch wording first. The timer shows the page anyway if the script never runs. */
html:not(.ready) main{visibility:hidden;animation:reveal 0s 1.5s forwards}
@keyframes reveal{to{visibility:visible}}
header{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}
/* The header is 38rem wide above 40rem. The brand needs about 389 px (logo plus the English title in a monospace font) and the slimmer button leaves it 416 px beside "Bahasa Indonesia"; 25rem sits between the two, and a wider font wraps the button to its own row. */
.brand{display:flex;gap:.75rem;align-items:flex-start;flex:1;min-width:min(100%,25rem)}
.brand>div{min-width:0}
/* The title block starts with the h1's .25rem top margin; the same offset puts the logo's top edge level with the title. */
.logo{flex:none;border-radius:.5rem;margin-top:.25rem}
#lang{flex:none;margin-left:auto;gap:.4rem;padding:.25rem .75rem;border:1px solid var(--border);font-size:.9rem}
#lang svg{flex:none;width:1rem;height:1rem}
h1{font-size:1.3rem;margin:.25rem 0}
p{margin:.25rem 0 .75rem}
.muted{color:var(--muted);font-size:.9rem}
.privacy-badge{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:.5rem 0 1rem;padding:.25rem .75rem;border:1px solid var(--border);border-radius:.75rem;background:var(--surface);font-size:.9rem;text-align:center}
.privacy-badge svg{flex:none;width:1rem;height:1rem;color:var(--accent-ink)}
button,.btn{font:inherit;font-size:1rem;min-height:44px;padding:.5rem 1rem;border-radius:.5rem;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button.ghost{background:transparent;color:var(--accent-ink)}
.row-actions button.ghost{border:1px solid var(--border);padding:.25rem .75rem}
:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.preview :focus-visible{outline-color:#f2b600}
/* Tab moves focus into the book's frame, where no selector from this page reaches: the reader sets .focused */
.pv-page.focused{outline:3px solid #f2b600;outline-offset:-3px}
.drop{border:1px dashed var(--accent-ink);border-radius:.75rem;padding:1.5rem 1rem;text-align:center;background:var(--surface)}
.drop.over{background:var(--over-bg);border-style:solid}
.drop-icon{display:block;width:2.5rem;height:2.5rem;margin:0 auto .25rem;color:var(--accent-ink)}
.formats-label{margin:.5rem 0 0;color:var(--muted);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:.1rem 1rem;justify-content:center;list-style:none;padding:0;margin:.15rem 0 1rem}
.chip{color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.03em}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.batch{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:1rem 0 0}
.batch[hidden],button[hidden]{display:none}
#clear-all{color:var(--muted);border-color:var(--border);font-size:.9rem;padding:.25rem .75rem}
#queue,#refusals{list-style:none;padding:0;margin:1rem 0 0}
.batch+#queue{margin-top:.75rem}
#queue li,#refusals li{background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:.75rem;margin-bottom:.5rem;display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center}
.name{font-weight:600;overflow-wrap:anywhere}
.status{font-size:.9rem;color:var(--muted)}
/* Plain text like the format chips: the glyph and the word tell the status, the colour only reinforces it. */
li .badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:600;color:var(--muted)}
.badge-icon{flex:none;font-weight:700;line-height:1}
li.converting .badge{color:var(--accent-ink)}
li.ready .badge{color:var(--ok)}
li.failed .badge{color:var(--err)}
li.waiting .badge,li.deleted .badge{color:var(--muted)}
progress.bar{grid-column:1/-1;display:block;width:100%;height:.5rem;border:0;border-radius:999px;overflow:hidden;appearance:none;-webkit-appearance:none;accent-color:var(--accent-ink);color:var(--accent-ink);background:var(--track)}
progress.bar::-webkit-progress-bar{background:var(--track);border-radius:999px}
progress.bar::-webkit-progress-value{background:var(--accent-ink);border-radius:999px}
progress.bar::-moz-progress-bar{background:var(--accent-ink);border-radius:999px}
/* The stripe tile is 1.5rem * sqrt(2) wide so the 45deg gradient repeats seamlessly while background-position moves one tile. */
progress.bar:not([value]){background:repeating-linear-gradient(45deg,var(--accent-ink) 0 .75rem,var(--track) .75rem 1.5rem);background-size:2.1213rem 2.1213rem;animation:bar-stripe 1s linear infinite}
progress.bar:not([value])::-webkit-progress-bar{background:transparent}
progress.bar:not([value])::-moz-progress-bar{background:transparent}
@keyframes bar-stripe{from{background-position:0 0}to{background-position:2.1213rem 0}}
@media (prefers-reduced-motion:reduce){progress.bar:not([value]){animation:none}}
.row-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;grid-column:1/-1}
.clock{font-variant-numeric:tabular-nums}
/* The countdown takes the free space, so the menu trigger after it sits at the right end of the row. */
.row-actions .clock{margin-left:auto}
.btn[aria-disabled="true"]{background:var(--disabled-bg);border-color:var(--disabled-bg);color:var(--muted);pointer-events:none}
.failed .status{color:var(--err)}
#refusals .reason{grid-column:1/-1;color:var(--text)}
#kindle-hint{margin:.5rem 0 0;font-size:.9rem}
button:disabled{border-color:var(--disabled-bg);color:var(--muted);cursor:default}
.row-actions button.more{min-width:44px;justify-content:center;padding:.25rem;text-decoration:none;font-size:1.25rem;line-height:1}
.menu{min-width:9rem;padding:.25rem;border:1px solid var(--border);border-radius:.5rem;background:var(--surface);color:var(--text);box-shadow:0 4px 16px rgb(0 0 0 / .25)}
.menu:popover-open{position:fixed;margin:0;inset:auto;display:flex;flex-direction:column}
.row-actions .menu button{width:100%;min-height:44px;justify-content:flex-start;text-decoration:none;border-color:transparent}
.preview{width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#17181c;color:#ececf1}
.preview::backdrop{background:#000c}
.pv{display:flex;flex-direction:column;height:100%}
.pv:fullscreen{width:100%;height:100%;background:#17181c}
.pv-bar{display:flex;gap:.5rem;align-items:center;padding:.5rem;border-bottom:1px solid #2c2d35}
.pv-bar button{min-width:44px;min-height:44px;justify-content:center;gap:.4rem;background:transparent;border-color:#4b4d5a;color:#ececf1}
.pv-bar button[aria-pressed="true"]{background:#2c2d35;border-color:#ececf1}
.pv-ico{flex:none;width:1.25rem;height:1.25rem;font-size:1.25rem;line-height:1.25rem;text-align:center}
.pv-title{flex:1;min-width:0;margin:0;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-body{position:relative;display:flex;flex:1;min-height:0}
.pv-toc{width:16rem;flex:none;overflow:auto;border-right:1px solid #2c2d35;padding:.5rem}
.pv-toc[hidden]{display:none}
.pv-toc ol{list-style:none;margin:0;padding:0}
.pv-toc ol ol{padding-left:1rem}
.pv-toc button{width:100%;justify-content:flex-start;text-align:left;background:transparent;border:0;color:inherit}
.pv-toc button[aria-current="true"]{background:var(--accent);color:#fff}
/* The preview chrome is dark in both themes, so --pv-stage is the same in both blocks: a step between the bar and the white page. */
.pv-stage{display:flex;flex:1;min-width:0;background:var(--pv-stage)}
.pv-page{flex:1;min-width:0;background:#fff}
.pv-page>*{display:block;width:100%;height:100%}
.pv-arrow{flex:none;align-self:center;width:44px;padding:0;justify-content:center;background:transparent;border:0;color:#ececf1;font-size:2rem}
/* The list slides over the page below 60rem; keep this width equal to PREVIEW_NARROW in src/main.ts. The tap-away layer sits under the list (z-index 1 < 2) and over the page. */
@media (max-width:60rem){.pv-toc{position:absolute;inset:0 auto 0 0;width:min(85%,18rem);z-index:2;background:#17181c;box-shadow:4px 0 16px #0008}.pv-toc:not([hidden])~.pv-stage{position:relative}.pv-toc:not([hidden])~.pv-stage::after{content:"";position:absolute;inset:0;z-index:1;background:#0006}}
@media (max-width:40rem){header{flex-direction:column-reverse;align-items:stretch}#lang{align-self:flex-end}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <img class="logo" src="./icon.svg" alt="" width="40" height="40">
      <div>
        <h1 data-i18n="title">pubmy: ubah file jadi EPUB</h1>
        <p class="muted" data-i18n="tagline"></p>
      </div>
    </div>
    <button type="button" id="lang" class="ghost">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a4 9 0 1 0 0 18a4 9 0 1 0 0-18z"/></svg>
      <span id="lang-label" data-i18n="lang-toggle"></span>
    </button>
  </header>
  <p class="privacy-badge">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span data-i18n="privacy"></span>
  </p>

  <section id="drop" class="drop" aria-labelledby="drop-hint">
    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <p id="drop-hint" data-i18n="drop-hint"></p>
    <p id="formats-label" class="formats-label" data-i18n="formats-label"></p>
    <ul class="chips" aria-labelledby="formats-label">
      <li class="chip">TXT</li>
      <li class="chip">MD</li>
      <li class="chip">HTML</li>
      <li class="chip">DOCX</li>
      <li class="chip">ODT</li>
      <li class="chip">RTF</li>
      <li class="chip">PDF</li>
      <li class="chip">MOBI</li>
      <li class="chip">AZW3</li>
      <li class="chip">CBZ</li>
      <li class="chip">CBR</li>
      <li class="chip">EPUB</li>
    </ul>
    <button type="button" id="choose" data-i18n="choose-files"></button>
    <input type="file" id="file" class="sr-only" tabindex="-1" aria-hidden="true" multiple
      accept=".txt,.md,.markdown,.html,.htm,.docx,.odt,.rtf,.pdf,.mobi,.azw3,.azw,.cbz,.cbr,.zip,.rar,.epub">
  </section>

  <ul id="refusals" aria-live="polite"></ul>
  <div id="batch" class="batch" hidden>
    <button type="button" id="download-all" data-i18n="download-all"></button>
    <button type="button" id="clear-all" class="ghost" data-i18n="clear-all"></button>
  </div>
  <ul id="queue" data-i18n-label="queue-label"></ul>
  <p id="kindle-hint" class="muted" data-i18n="kindle-hint" hidden></p>
  <p id="live" class="sr-only" role="status" aria-live="polite"></p>
</main>
<dialog id="preview" class="preview" aria-labelledby="pv-title">
  <div class="pv">
    <div class="pv-bar">
      <button type="button" id="pv-toc-toggle" aria-controls="pv-toc" aria-expanded="false"><span class="pv-ico" aria-hidden="true">&#x2630;</span><span data-i18n="preview-toc"></span></button>
      <h2 id="pv-title" class="pv-title"></h2>
      <button type="button" id="pv-fullscreen" aria-pressed="false" data-i18n-label="preview-fullscreen" hidden><svg class="pv-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9V4h5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path d="M9 20H4v-5"/></svg></button>
      <button type="button" id="pv-close" data-i18n-label="preview-close">&#x2715;</button>
    </div>
    <div class="pv-body">
      <nav id="pv-toc" class="pv-toc" data-i18n-label="preview-toc" hidden><ol id="pv-toc-list"></ol></nav>
      <div id="pv-stage" class="pv-stage">
        <button type="button" id="pv-prev" class="pv-arrow" data-i18n-label="preview-prev">&#x2039;</button>
        <div id="pv-page" class="pv-page"></div>
        <button type="button" id="pv-next" class="pv-arrow" data-i18n-label="preview-next">&#x203A;</button>
      </div>
    </div>
  </div>
</dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
