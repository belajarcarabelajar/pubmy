name: install-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # the skills CLI needs Node 22.20 or newer
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun test scripts/readme-install.test.ts
      - name: skills CLI add and remove
        shell: bash
        env:
          HOME: ${{ runner.temp }}/skills-home
          USERPROFILE: ${{ runner.temp }}/skills-home
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p "$HOME"
          npx -y skills add ./ --skill pubmy -a codex -g -y
          bun -e 'const p = require("path").join(require("os").homedir(), ".agents/skills/pubmy/scripts/pubmy.js"); if (!require("fs").existsSync(p)) { console.error("missing " + p); process.exit(1); }'
          npx -y skills remove pubmy -g -y
          bun -e 'const p = require("path").join(require("os").homedir(), ".agents/skills/pubmy/scripts/pubmy.js"); if (require("fs").existsSync(p)) { console.error("still present " + p); process.exit(1); }'

  dev-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test apps/cli/test/cli.test.ts
