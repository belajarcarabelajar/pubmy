name: install-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # the skills CLI needs Node 22.20 or newer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun test scripts/readme-install.test.ts
      - name: skills CLI add and remove
        shell: bash
        env:
          HOME: ${{ runner.temp }}/skills-home
          USERPROFILE: ${{ runner.temp }}/skills-home
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p "$HOME"
          npx -y skills add ./ --skill pubmy -a codex -g -y
          bun -e 'const p = require("path").join(require("os").homedir(), ".agents/skills/pubmy/scripts/pubmy.js"); if (!require("fs").existsSync(p)) { console.error("missing " + p); process.exit(1); }'
          npx -y skills remove pubmy -g -y
          bun -e 'const p = require("path").join(require("os").homedir(), ".agents/skills/pubmy/scripts/pubmy.js"); if (require("fs").existsSync(p)) { console.error("still present " + p); process.exit(1); }'

  dev-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test apps/cli/test/cli.test.ts apps/cli/test/cli-run.test.ts scripts/workflow-pins.test.ts
      # release guard, workflow shape, ZIP packing and plugin manifest (the plugin install case skips without the claude CLI)
      - run: bun test scripts/release-check.test.ts scripts/workflows.test.ts scripts/pack-skill.test.ts scripts/plugin-manifest.test.ts
